<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Musical</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <!-- ================= HEADER (упрощённый) ================= -->
    <header class="site-header fixed-top">
        <nav class="navbar navbar-dark py-2">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                    <span class="logo-mark"><i class="bi bi-soundwave"></i></span>
                    <span class="logo-text">Musical</span>
                </a>
                <a href="index.html" class="btn btn-outline-light btn-nav">
                    <i class="bi bi-arrow-left me-1"></i> На главную
                </a>
            </div>
        </nav>
    </header>

    <!-- ================= ФОРМА ВХОДА ================= -->
    <main class="auth-main">
        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100 py-5">
                <div class="col-lg-5 col-md-7 col-sm-10">
                    <div class="auth-card reveal active">
                        <div class="text-center mb-4">
                            <span class="logo-mark mx-auto mb-3"><i class="bi bi-person-lock"></i></span>
                            <h1 class="auth-title">Вход в Musical</h1>
                            <p class="auth-sub">Введите логин и пароль, чтобы продолжить</p>
                        </div>

                        <form id="loginForm" novalidate>
                            <div class="mb-3">
                                <label class="form-label">Логин</label>
                                <input type="text" class="form-control form-control-lg" id="loginInput" placeholder="admin" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Пароль</label>
                                <input type="password" class="form-control form-control-lg" id="passwordInput" placeholder="••••••" required>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="remember">
                                    <label class="form-check-label" for="remember">Запомнить меня</label>
                                </div>
                                <a href="#" class="auth-link">Забыли пароль?</a>
                            </div>
                            <button type="submit" class="btn btn-accent w-100 btn-lg mb-3">Войти</button>
                            <p class="auth-hint text-center mb-0">
                                Демо: <b>admin</b> / <b>1234</b>
                            </p>
                        </form>

                        <hr class="auth-divider">
                        <p class="text-center mb-0 auth-hint">
                            Нет аккаунта? <a href="register.html" class="auth-link">Зарегистрироваться</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Модалка "Ошибка входа" -->
    <div class="modal fade" id="errorModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content error-modal text-center p-4">
                <i class="bi bi-x-circle-fill error-icon"></i>
                <h5 class="mt-3">Ошибка входа</h5>
                <p class="text-muted mb-4">Неверный логин или пароль.</p>
                <button class="btn btn-accent w-100" data-bs-dismiss="modal">Попробовать снова</button>
            </div>
        </div>
    </div>

    <!-- Модалка "Успех" -->
    <div class="modal fade" id="successModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content error-modal text-center p-4">
                <i class="bi bi-check-circle-fill success-icon"></i>
                <h5 class="mt-3">Добро пожаловать!</h5>
                <p class="text-muted mb-4">Вы успешно вошли в систему.</p>
                <a href="index.html" class="btn btn-accent w-100">На главную</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
