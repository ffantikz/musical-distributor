<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Musical</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <header class="site-header fixed-top">
        <nav class="navbar navbar-dark py-2">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                    <span class="logo-mark"><i class="bi bi-soundwave"></i></span>
                    <span class="logo-text">Musical</span>
                </a>
                <a href="index.html" class="btn btn-outline-light btn-nav">
                    <i class="bi bi-arrow-left me-1"></i> На главную
                </a>
            </div>
        </nav>
    </header>

    <main class="auth-main">
        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100 py-5">
                <div class="col-lg-6 col-md-8 col-sm-10">
                    <div class="auth-card reveal active">
                        <div class="text-center mb-4">
                            <span class="logo-mark mx-auto mb-3"><i class="bi bi-person-plus"></i></span>
                            <h1 class="auth-title">Создать аккаунт</h1>
                            <p class="auth-sub">Зарегистрируйтесь и начните распространять музыку</p>
                        </div>

                        <form id="registerForm" novalidate>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Имя</label>
                                    <input type="text" class="form-control form-control-lg" id="regName" placeholder="Иван" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control form-control-lg" id="regEmail" placeholder="you@mail.ru" required>
                                </div>
                            </div>

                            <div class="mb-3 mt-3">
                                <label class="form-label">Логин</label>
                                <input type="text" class="form-control form-control-lg" id="regLogin" placeholder="artist_name" required>
                            </div>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Пароль</label>
                                    <input type="password" class="form-control form-control-lg" id="regPassword" placeholder="Минимум 6 символов" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Повторите пароль</label>
                                    <input type="password" class="form-control form-control-lg" id="regPassword2" placeholder="••••••" required>
                                </div>
                            </div>

                            <div class="form-check my-4">
                                <input class="form-check-input" type="checkbox" id="agree" required>
                                <label class="form-check-label" for="agree">
                                    Я согласен с <a href="#" class="auth-link">условиями</a> и <a href="#" class="auth-link">политикой конфиденциальности</a>
                                </label>
                            </div>

                            <button type="submit" class="btn btn-accent w-100 btn-lg mb-3">Зарегистрироваться</button>
                        </form>

                        <hr class="auth-divider">
                        <p class="text-center mb-0 auth-hint">
                            Уже есть аккаунт? <a href="login.html" class="auth-link">Войти</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Модалка "Ошибка регистрации" -->
    <div class="modal fade" id="regErrorModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content error-modal text-center p-4">
                <i class="bi bi-x-circle-fill error-icon"></i>
                <h5 class="mt-3">Ошибка</h5>
                <p class="text-muted mb-4" id="regErrorText">Проверьте введённые данные.</p>
                <button class="btn btn-accent w-100" data-bs-dismiss="modal">Ок</button>
            </div>
        </div>
    </div>

    <!-- Модалка "Успех" -->
    <div class="modal fade" id="regSuccessModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content error-modal text-center p-4">
                <i class="bi bi-check-circle-fill success-icon"></i>
                <h5 class="mt-3">Готово!</h5>
                <p class="text-muted mb-4">Аккаунт успешно создан. Теперь войдите в систему.</p>
                <a href="login.html" class="btn btn-accent w-100">Перейти к входу</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
